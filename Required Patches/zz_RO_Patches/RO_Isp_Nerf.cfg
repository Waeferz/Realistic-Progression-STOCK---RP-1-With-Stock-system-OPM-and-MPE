@PART[*]:HAS[@MODULE[ModuleEngineConfigs]|@MODULE[ModuleEnginesRF]]:FINAL
{
    @MODULE[ModuleEngineConfigs],*
    {
        @CONFIG,*
        {
            @atmosphereCurve
            {
                @key,0[1, ] *= 0.40
                @key,1[1, ] *= 0.40
            }
        }
    }
    @MODULE[ModuleEnginesRF],*
    {
        @atmosphereCurve
        {
            @key,0[1, ] *= 0.40
            @key,1[1, ] *= 0.40
        }
    }
}